<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vito Furio — Portfolio artistico</title>
<meta name="description" content="Portfolio artistico di Vito Furio: dipinti, illustrazioni, pirografie, murales, scenografie, teatro, arte di strada e Sand Art.">
<meta name="robots" content="index,follow,max-image-preview:large">
<link rel="canonical" href="https://portfolio-vito-furio.pages.dev/">
<meta property="og:url" content="https://portfolio-vito-furio.pages.dev/">
<meta property="og:type" content="website">
<meta property="og:title" content="Vito Furio — Portfolio artistico">
<meta property="og:description" content="Un percorso tra immagine, materia, personaggio e scena.">
<meta property="og:image" content="/assets/images/portfolio-og.jpg">
<meta name="theme-color" content="#15120f">
<style>
:root{--bg:#15120f;--paper:#f1eadf;--gold:#d2a95f;--rust:#9b422d;--muted:#b9aea0;--line:rgba(255,255,255,.15)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--paper);font-family:Arial,Helvetica,sans-serif;line-height:1.55}
img{max-width:100%;display:block}a{color:inherit}
.shell{width:min(1220px,calc(100% - 34px));margin:auto}
header{position:fixed;z-index:30;inset:0 0 auto;background:linear-gradient(#0d0b09e8,transparent);padding:20px 0}
nav{display:flex;justify-content:space-between;align-items:center;gap:25px}
.brand{font-family:Georgia,serif;text-transform:uppercase;letter-spacing:.18em;text-decoration:none;font-size:1rem}
.links{display:flex;gap:24px;font-size:.75rem;letter-spacing:.13em;text-transform:uppercase}
.links a{text-decoration:none;opacity:.75}.links a:hover{opacity:1}
.hero{min-height:100svh;display:grid;align-items:end;position:relative;overflow:hidden;background:#100e0c}
.hero-media{position:absolute;inset:0}
.hero-media img{width:100%;height:100%;object-fit:cover;object-position:center 42%;filter:saturate(.88) contrast(1.05)}
.hero-media:after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(10,8,7,.94) 0%,rgba(10,8,7,.68) 38%,rgba(10,8,7,.18) 75%),linear-gradient(0deg,rgba(10,8,7,.94),transparent 58%)}
.hero-copy{position:relative;z-index:2;padding:150px 0 72px;max-width:820px}
.eyebrow{display:block;color:var(--gold);font-size:.76rem;letter-spacing:.22em;text-transform:uppercase;margin-bottom:18px}
h1,h2,h3{font-family:Georgia,"Times New Roman",serif;font-weight:400;margin:0}
h1{font-size:clamp(4.5rem,11vw,9.6rem);line-height:.82;letter-spacing:-.065em}
.hero-copy p{font-size:clamp(1.08rem,2vw,1.46rem);max-width:660px;color:#d8d0c5;margin:28px 0 34px}
.cta{display:inline-flex;width:max-content;text-decoration:none;border:1px solid #ffffff66;padding:13px 18px;text-transform:uppercase;letter-spacing:.14em;font-size:.73rem}
.cta:hover{background:var(--paper);color:var(--bg)}
.intro{background:var(--paper);color:var(--bg);padding:100px 0}
.intro-grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:8vw}
.intro h2,.gallery-head h2,.contact h2{font-size:clamp(3rem,6vw,6rem);line-height:.92;letter-spacing:-.045em}
.intro-text{font-family:Georgia,serif;font-size:clamp(1.25rem,2.2vw,1.8rem)}
.intro-text p{margin-top:0}
.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:#261e1840;margin-top:65px}
.field{background:var(--paper);padding:24px;min-height:130px;border-top:3px solid var(--rust)}
.field strong{font-family:Georgia,serif;font-size:1.3rem;font-weight:400}
.field small{display:block;margin-top:8px;color:#645a50}
.gallery-section{padding:95px 0}
.gallery-head{display:flex;justify-content:space-between;align-items:end;gap:30px;margin-bottom:36px}
.filters{display:flex;flex-wrap:wrap;gap:8px}
.filters button{border:1px solid var(--line);background:transparent;color:var(--paper);border-radius:999px;padding:9px 13px;cursor:pointer;text-transform:uppercase;letter-spacing:.09em;font-size:.68rem}
.filters button.active,.filters button:hover{background:var(--paper);color:var(--bg)}
.gallery{columns:4 260px;column-gap:18px}
.work{break-inside:avoid;margin:0 0 18px;background:#211c17;border:1px solid #ffffff12;cursor:zoom-in;transition:.25s}
.work:hover{transform:translateY(-4px);border-color:#d2a95fa8}
.work.hidden{display:none}
.work figure{margin:0;overflow:hidden;background:#090806}
.work figure img{width:100%;height:auto;transition:transform .5s}
.work:hover figure img{transform:scale(1.025)}
.meta{padding:15px 16px 18px}
.meta span{color:var(--gold);font-size:.65rem;letter-spacing:.14em;text-transform:uppercase}
.meta h3{font-size:1.35rem;margin:4px 0}
.meta p{margin:0;color:var(--muted);font-size:.86rem}
.statement{padding:100px 0;border-block:1px solid var(--line)}
blockquote{font-family:Georgia,serif;font-size:clamp(2.3rem,5.4vw,5.4rem);line-height:1.04;letter-spacing:-.035em;margin:0;max-width:1100px}
.contact{background:var(--rust);padding:95px 0}
.contact-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:8vw;align-items:end}
.details a{display:block;text-decoration:none;padding:10px 0;border-bottom:1px solid #ffffff66}
footer{padding:28px 0;color:#8f8579;font-size:.76rem}
.lightbox{position:fixed;z-index:100;inset:0;background:#050403f5;display:none;align-items:center;justify-content:center;padding:28px}
.lightbox.open{display:flex}
.lightbox figure{margin:0;max-width:min(1150px,94vw);max-height:92vh}
.lightbox img{max-height:78vh;margin:auto;object-fit:contain}
.lightbox figcaption{text-align:center;padding:14px;color:#d9cfc1}
.close{position:absolute;right:22px;top:14px;background:none;border:0;color:#fff;font-size:2.5rem;cursor:pointer}
.loading,.error{padding:50px 0;color:var(--muted)}
@media(max-width:850px){.links{display:none}.hero-copy{padding:135px 0 45px}.intro-grid,.contact-grid{grid-template-columns:1fr;gap:38px}.fields{grid-template-columns:1fr 1fr}.gallery-head{align-items:start;flex-direction:column}}
@media(max-width:520px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<header><div class="shell"><nav><a class="brand" href="#top" id="brand">Vito Furio</a><div class="links"><a href="#artista">Artista</a><a href="#opere">Opere</a><a href="#contatti">Contatti</a></div></nav></div></header>
<main id="top">
<section class="hero">
  <div class="hero-media"><img id="hero-image" src="/assets/images/dipinti-personaggio-bolle.webp" alt="Opera di Vito Furio"></div>
  <div class="shell hero-copy">
    <span class="eyebrow">Portfolio artistico</span>
    <h1 id="hero-name">Vito<br>Furio</h1>
    <p id="hero-text"></p>
    <a class="cta" href="#opere">Esplora le opere ↓</a>
  </div>
</section>
<section class="intro" id="artista"><div class="shell">
  <div class="intro-grid">
    <div><span class="eyebrow" style="color:var(--rust)">Profilo</span><h2 id="profile-title"></h2></div>
    <div class="intro-text"><p id="profile-p1"></p><p id="profile-p2"></p></div>
  </div>
  <div class="fields" id="disciplines"></div>
</div></section>
<section class="gallery-section" id="opere"><div class="shell">
  <div class="gallery-head">
    <div><span class="eyebrow">Archivio selezionato</span><h2>Opere</h2></div>
    <div class="filters" id="filters" role="group" aria-label="Filtra per tecnica"></div>
  </div>
  <div class="gallery" id="gallery"><p class="loading">Caricamento delle opere…</p></div>
</div></section>
<section class="statement"><div class="shell"><blockquote id="statement"></blockquote></div></section>
<section class="contact" id="contatti"><div class="shell contact-grid">
  <div><span class="eyebrow" style="color:#f4d8aa">Contatti</span><h2 id="contact-title"></h2></div>
  <div class="details">
    <p id="contact-text"></p>
    <a id="email-link" href=""></a>
    <a id="phone-link" href=""></a>
    <p id="location"></p>
  </div>
</div></section>
</main>
<footer><div class="shell" id="footer-text"></div></footer>
<div class="lightbox" role="dialog" aria-modal="true" aria-label="Opera ingrandita">
<button class="close" aria-label="Chiudi">×</button>
<figure><img src="" alt=""><figcaption></figcaption></figure>
</div>
<script>
const esc=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[ch]));
const categoryOrder=['dipinti','pirografie','murales','scenografie','teatro','sandart'];
let categoryLabels={};

function splitName(name){
  const parts=String(name||'Vito Furio').trim().split(/\s+/);
  if(parts.length<2)return esc(name);
  return esc(parts.slice(0,-1).join(' '))+'<br>'+esc(parts.at(-1));
}
function renderSite(site){
  document.title=site.titolo_pagina||'Portfolio artistico';
  const meta=document.querySelector('meta[name="description"]');
  if(meta)meta.content=site.descrizione_pagina||'';
  document.getElementById('brand').textContent=site.nome_artista||'Vito Furio';
  document.getElementById('hero-name').innerHTML=splitName(site.nome_artista);
  document.getElementById('hero-text').textContent=site.testo_copertina||'';
  const hero=document.getElementById('hero-image');
  hero.src=site.immagine_copertina||'/assets/images/dipinti-personaggio-bolle.webp';
  hero.alt='Opera di '+(site.nome_artista||'Vito Furio');
  document.getElementById('profile-title').textContent=site.titolo_profilo||'';
  document.getElementById('profile-p1').textContent=site.profilo_paragrafo_1||'';
  document.getElementById('profile-p2').textContent=site.profilo_paragrafo_2||'';
  const disciplines=Array.isArray(site.discipline)?site.discipline:[];
  categoryLabels=Object.fromEntries(disciplines.map(item=>[item.codice,item.titolo]));
  document.getElementById('disciplines').innerHTML=disciplines.map(item=>`<div class="field"><strong>${esc(item.titolo)}</strong><small>${esc(item.descrizione)}</small></div>`).join('');
  document.getElementById('statement').textContent=site.frase||'';
  document.getElementById('contact-title').textContent=site.titolo_contatti||'';
  document.getElementById('contact-text').textContent=site.testo_contatti||'';
  const email=site.email||'';
  document.getElementById('email-link').textContent=email;
  document.getElementById('email-link').href=email?`mailto:${email}`:'#';
  const phone=site.telefono||'';
  document.getElementById('phone-link').textContent=phone;
  document.getElementById('phone-link').href=phone?`tel:${phone.replace(/[^\d+]/g,'')}`:'#';
  document.getElementById('location').textContent=site.luogo||'';
  document.getElementById('footer-text').textContent=site.testo_footer||'';
}
function renderFilters(works){
  const present=new Set(works.map(w=>w.categoria));
  const filters=[{code:'all',label:'Tutte'}].concat(categoryOrder.filter(code=>present.has(code)).map(code=>({code,label:categoryLabels[code]||code})));
  const node=document.getElementById('filters');
  node.innerHTML=filters.map((f,i)=>`<button class="${i===0?'active':''}" data-filter="${esc(f.code)}">${esc(f.label)}</button>`).join('');
  node.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>{
    node.querySelectorAll('button').forEach(x=>x.classList.remove('active'));
    button.classList.add('active');
    applyFilter(button.dataset.filter);
  }));
}
function workCard(work){
  const label=categoryLabels[work.categoria]||work.categoria;
  return `<article class="work" data-cat="${esc(work.categoria)}" tabindex="0" data-src="${esc(work.immagine)}" data-title="${esc(work.titolo)}" data-desc="${esc(work.descrizione)}">
    <figure><img src="${esc(work.immagine)}" alt="${esc(work.titolo)}: ${esc(work.descrizione)}" loading="lazy"></figure>
    <div class="meta"><span>${esc(label)}</span><h3>${esc(work.titolo)}</h3><p>${esc(work.descrizione)}</p></div>
  </article>`;
}
function renderWorks(works){
  const visible=works.filter(w=>w.visibile!==false).sort((a,b)=>Number(a.ordine||0)-Number(b.ordine||0));
  const gallery=document.getElementById('gallery');
  gallery.innerHTML=visible.length?visible.map(workCard).join(''):'<p class="error">Non ci sono opere visibili.</p>';
  renderFilters(visible);
  attachLightbox();
}
function applyFilter(filter){
  document.querySelectorAll('.work').forEach(card=>card.classList.toggle('hidden',filter!=='all'&&card.dataset.cat!==filter));
}
const box=document.querySelector('.lightbox'),boxImage=box.querySelector('img'),boxCaption=box.querySelector('figcaption');
function openWork(card){
  boxImage.src=card.dataset.src;
  boxImage.alt=card.dataset.title;
  boxCaption.textContent=card.dataset.title+(card.dataset.desc?' — '+card.dataset.desc:'');
  box.classList.add('open');
  document.body.style.overflow='hidden';
}
function closeWork(){box.classList.remove('open');boxImage.src='';document.body.style.overflow='';}
function attachLightbox(){
  document.querySelectorAll('.work').forEach(card=>{
    card.addEventListener('click',()=>openWork(card));
    card.addEventListener('keydown',event=>{if(event.key==='Enter'||event.key===' ')openWork(card);});
  });
}
box.querySelector('.close').addEventListener('click',closeWork);
box.addEventListener('click',event=>{if(event.target===box)closeWork();});
document.addEventListener('keydown',event=>{if(event.key==='Escape')closeWork();});

Promise.all([
  fetch('/data/sito.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Impostazioni non disponibili');return r.json();}),
  fetch('/data/opere.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('Archivio opere non disponibile');return r.json();})
]).then(([site,works])=>{renderSite(site);renderWorks(Array.isArray(works)?works:[]);})
.catch(error=>{
  console.error(error);
  document.getElementById('gallery').innerHTML='<p class="error">Il portfolio non può essere caricato in questo momento.</p>';
});
</script>
</body>
</html>
